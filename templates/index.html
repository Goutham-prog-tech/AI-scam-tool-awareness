<!DOCTYPE html>
<html lang="en" data-theme="dark" data-size="m" data-motion="on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Scam Awareness Tool</title>
<style nonce="{{ nonce }}">
  @font-face { font-family:"Outfit"; font-style:normal; font-weight:100 900; font-display:swap;
    src:url(/static/fonts/outfit-latin-wght-normal.woff2) format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family:"Outfit"; font-style:normal; font-weight:100 900; font-display:swap;
    src:url(/static/fonts/outfit-latin-ext-wght-normal.woff2) format("woff2");
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family:"Noto Sans Telugu"; font-style:normal; font-weight:100 900; font-display:swap;
    src:url(/static/fonts/noto-sans-telugu-telugu-wght-normal.woff2) format("woff2");
    unicode-range:U+0951-0952,U+0964-0965,U+0C00-0C7F,U+1CDA,U+1CF2,U+200C-200D,U+25CC; }

  :root {
    --bg1:#070b1f; --bg2:#120c3a; --bg3:#07324f;
    --aur1:rgba(124,58,237,.55); --aur2:rgba(6,182,212,.45); --aur3:rgba(236,72,153,.35);
    --grid:rgba(34,211,238,.35); --cube-b:rgba(125,211,252,.55); --cube-bg:rgba(99,102,241,.10);
    --card:rgba(255,255,255,.07); --card-b:rgba(255,255,255,.15);
    --text:#eef2ff; --muted:#a9b4d6; --accent:#7c6cff; --accent2:#22d3ee;
    --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
    --side:rgba(8,12,32,.84); --input:rgba(255,255,255,.08); --btn-text:#fff;
    --danger1:#ef4444; --danger2:#f97316; --shadow:rgba(0,0,0,.35);
  }
  html[data-theme="light"] {
    --bg1:#f2f6ff; --bg2:#e9e7ff; --bg3:#dcf4ff;
    --aur1:rgba(129,140,248,.55); --aur2:rgba(56,189,248,.45); --aur3:rgba(244,114,182,.35);
    --grid:rgba(79,70,229,.28); --cube-b:rgba(79,70,229,.45); --cube-bg:rgba(129,140,248,.14);
    --card:rgba(255,255,255,.82); --card-b:rgba(99,102,241,.22);
    --text:#14213d; --muted:#51607f; --accent:#4f46e5; --accent2:#0891b2;
    --side:rgba(255,255,255,.9); --input:rgba(255,255,255,.96); --shadow:rgba(60,70,140,.18);
  }
  html[data-theme="contrast"] {
    --bg1:#000; --bg2:#000; --bg3:#000; --aur1:transparent; --aur2:transparent; --aur3:transparent;
    --grid:transparent; --cube-b:transparent; --cube-bg:transparent;
    --card:#000; --card-b:#ffff00; --text:#fff; --muted:#ffff99; --accent:#ffff00; --accent2:#00ffff;
    --btn-text:#000; --side:#000; --input:#000; --ok:#00ff66; --warn:#ffcc00; --bad:#ff5555;
    --danger1:#ffff00; --danger2:#ffff00; --shadow:transparent;
  }
  html { font-size:16px; }
  html[data-size="s"] { font-size:14.5px; }
  html[data-size="l"] { font-size:18.5px; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:var(--text); overflow-x:hidden;
    font-family:"Outfit","Noto Sans Telugu","Nirmala UI","Segoe UI",system-ui,sans-serif; line-height:1.6;
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3)); background-attachment:fixed; }
  .hidden { display:none !important; }

  /* ===== 3D animated background ===== */
  .bg { position:fixed; inset:0; overflow:hidden; z-index:-1; pointer-events:none;
    background:radial-gradient(1100px 650px at 12% -8%,var(--aur1),transparent 62%),
               radial-gradient(900px 600px at 98% 8%,var(--aur2),transparent 62%),
               radial-gradient(1000px 700px at 50% 118%,var(--aur3),transparent 62%); }
  .aurora { position:absolute; inset:-25%; opacity:.4; filter:blur(90px);
    background:conic-gradient(from 0deg at 50% 50%,transparent,var(--aur1),transparent 28%,var(--aur2),transparent 58%,var(--aur3),transparent);
    animation:spin 50s linear infinite; }
  .grid3d { position:absolute; left:-60%; right:-60%; bottom:-8%; height:62%; opacity:.55;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:64px 64px; transform:perspective(520px) rotateX(64deg); transform-origin:50% 100%;
    -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 88%); mask-image:linear-gradient(to top,#000 0%,transparent 88%);
    animation:gridMove 5s linear infinite; }
  .stars { position:absolute; inset:0; opacity:.55;
    background-image:radial-gradient(1.4px 1.4px at 20px 30px,#fff,transparent),radial-gradient(1.2px 1.2px at 110px 90px,#cfe8ff,transparent),
                     radial-gradient(1.6px 1.6px at 190px 40px,#fff,transparent),radial-gradient(1px 1px at 70px 150px,#fff,transparent);
    background-size:240px 190px; animation:twinkle 6s ease-in-out infinite; }
  html[data-theme="light"] .stars, html[data-theme="contrast"] .stars { display:none; }
  .scene3d { position:absolute; inset:0; perspective:1000px; }
  .cube { position:absolute; width:var(--s); height:var(--s); transform-style:preserve-3d; animation:cubeSpin var(--d) linear infinite; opacity:.7; }
  .cube i { position:absolute; inset:0; border:1.5px solid var(--cube-b); background:var(--cube-bg); backdrop-filter:blur(2px); }
  .cube i:nth-child(1) { transform:translateZ(calc(var(--s)/2)); }
  .cube i:nth-child(2) { transform:rotateY(180deg) translateZ(calc(var(--s)/2)); }
  .cube i:nth-child(3) { transform:rotateY(90deg) translateZ(calc(var(--s)/2)); }
  .cube i:nth-child(4) { transform:rotateY(-90deg) translateZ(calc(var(--s)/2)); }
  .cube i:nth-child(5) { transform:rotateX(90deg) translateZ(calc(var(--s)/2)); }
  .cube i:nth-child(6) { transform:rotateX(-90deg) translateZ(calc(var(--s)/2)); }
  .c1 { --s:70px; --d:22s; left:8%; top:14%; }
  .c2 { --s:46px; --d:17s; right:9%; top:22%; }
  .c3 { --s:90px; --d:30s; right:16%; bottom:20%; }
  .c4 { --s:38px; --d:14s; left:14%; bottom:26%; }
  .ring { position:absolute; width:150px; height:150px; border-radius:50%; border:4px solid var(--cube-b); animation:ringSpin 16s linear infinite; opacity:.5; }
  .r1 { left:40%; top:6%; }
  .r2 { right:30%; bottom:8%; width:110px; height:110px; animation-duration:22s; }
  button.btn.block { width:100%; }
  .btn.small { padding:8px 16px; font-size:.9rem; }
  .danger-banner { margin-top:14px; padding:14px 16px; border-radius:14px; font-weight:700; border:2px solid var(--bad);
    background:rgba(239,68,68,.16); animation:dangerPulse 1.8s ease-in-out infinite; }
  @keyframes dangerPulse { 0%,100% { box-shadow:0 0 0 0 rgba(239,68,68,.55); } 50% { box-shadow:0 0 0 8px rgba(239,68,68,0); } }
  html[data-motion="off"] .danger-banner { animation:none; }
  @media (prefers-reduced-motion: reduce) { .danger-banner { animation:none; } }
  /* sticky risk strip: the result stays visible at the top while reading the details */
  .risk-strip { position:sticky; top:0; z-index:12; display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:var(--side); border-bottom:3px solid var(--rs-c,var(--ok)); cursor:pointer; }
  .risk-strip.rs-low { --rs-c:var(--ok); } .risk-strip.rs-mid { --rs-c:var(--warn); } .risk-strip.rs-high { --rs-c:var(--bad); }
  .rs-ico { font-size:1.4rem; } .rs-level { font-weight:700; font-size:.95rem; line-height:1.25; flex:1; min-width:0; }
  .rs-score { font-weight:800; white-space:nowrap; color:var(--rs-c,var(--ok)); }
  .rs-bar { width:70px; height:8px; border-radius:6px; background:rgba(148,163,184,.3); overflow:hidden; flex:none; }
  .rs-bar > div { height:100%; width:0; background:var(--rs-c,var(--ok)); transition:width .5s ease; }
  #out { scroll-margin-top:70px; }
  .listen-bar { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .voice-status { margin-top:10px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes gridMove { to { background-position:0 64px; } }
  @keyframes twinkle { 0%,100% { opacity:.25; } 50% { opacity:.7; } }
  @keyframes cubeSpin { from { transform:rotateX(20deg) rotateY(0deg); } to { transform:rotateX(380deg) rotateY(360deg); } }
  @keyframes ringSpin { from { transform:rotateX(58deg) rotateZ(0deg); } to { transform:rotateX(58deg) rotateZ(360deg); } }
  html[data-motion="off"] .aurora, html[data-motion="off"] .grid3d, html[data-motion="off"] .stars,
  html[data-motion="off"] .cube, html[data-motion="off"] .ring { animation:none; }
  @media (prefers-reduced-motion: reduce) { .aurora, .grid3d, .stars, .cube, .ring { animation:none; } }

  /* ===== light mode (default on phones): no heavy blur, no fixed background, no moving 3D scene ===== */
  html[data-motion="lite"] .aurora, html[data-motion="lite"] .grid3d, html[data-motion="lite"] .stars,
  html[data-motion="lite"] .scene3d { display:none; }
  html[data-motion="lite"] body { background-attachment:scroll; }
  html[data-motion="lite"] .card, html[data-motion="lite"] .sidebar, html[data-motion="lite"] .modal,
  html[data-motion="lite"] .how-card, html[data-motion="lite"] .panel { backdrop-filter:none; -webkit-backdrop-filter:none; }
  html[data-motion="lite"] .hero-idle, html[data-motion="lite"] .danger-banner, html[data-motion="lite"] .sign,
  html[data-motion="lite"] .steps-list li, html[data-motion="lite"] .verdict-ico, html[data-motion="lite"] .radar i { animation:none; }
  html[data-motion="lite"] .tilt { transform:none !important; }
  .cube i { backdrop-filter:none !important; }
  @media (max-width: 900px) {
    body { background-attachment:scroll; }
    .aurora { filter:blur(45px); animation-duration:90s; }
    .grid3d { animation:none; }
    .card, .sidebar, .panel, .how-card { backdrop-filter:none; -webkit-backdrop-filter:none; }
  }
  @media (max-width: 600px) { .how { display:none; } .rs-bar { width:46px; } }

  /* ===== sidebar ===== */
  .sidebar { position:fixed; left:0; top:0; bottom:0; width:340px; overflow-y:auto; z-index:20;
    background:var(--side); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-right:1px solid var(--card-b); padding:18px 16px 28px; transition:transform .3s ease; }
  .side-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .side-head h2 { margin:0; font-size:1.3rem; font-weight:700; }
  .panel { background:var(--card); border:1px solid var(--card-b); border-radius:16px; padding:14px; margin-bottom:14px; }
  .panel h3 { margin:0 0 8px; font-size:1.02rem; font-weight:650; }
  .panel ol, .panel ul { margin:6px 0 0; padding-left:20px; font-size:.9rem; }
  .panel li { margin-bottom:6px; }
  .helpline { border:1px solid transparent; background:linear-gradient(var(--side),var(--side)) padding-box,
      linear-gradient(135deg,var(--danger1),var(--danger2)) border-box; }
  .hl-sub { color:var(--muted); font-size:.85rem; margin:0 0 4px; }
  .hl-number { font-size:3.2rem; font-weight:800; letter-spacing:4px; line-height:1.1;
    background:linear-gradient(135deg,var(--danger1),var(--danger2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  html[data-theme="contrast"] .hl-number { color:var(--accent); background:none; }
  .gap-top { margin-top:16px !important; }
  .label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 6px; }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; padding:8px 6px; border-radius:10px; border:1px solid var(--card-b); background:var(--input);
    color:var(--text); cursor:pointer; font:inherit; font-size:.85rem; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:var(--btn-text); border-color:var(--accent); font-weight:600; }
  select { width:100%; padding:9px 10px; border-radius:10px; border:1px solid var(--card-b); background:var(--input); color:var(--text); font:inherit; }
  select option { color:#14213d; background:#fff; }
  .small-note { color:var(--muted); font-size:.85rem; margin:0; }
  .badge { display:inline-block; margin-top:10px; padding:5px 12px; border-radius:999px; font-size:.8rem; font-weight:600;
    background:rgba(34,197,94,.16); color:var(--ok); border:1px solid var(--ok); }

  /* ===== main ===== */
  .main { margin-left:340px; min-height:100vh; display:flex; flex-direction:column; }
  .alert-bar { display:block; text-align:center; padding:10px 14px; font-weight:600; font-size:.95rem; text-decoration:none;
    color:#fff; background:linear-gradient(90deg,var(--danger1),var(--danger2)); }
  html[data-theme="contrast"] .alert-bar { color:#000; }
  .topbar { display:none; padding:12px 16px 0; }
  .wrap { width:100%; max-width:900px; margin:0 auto; padding:18px 18px 40px; flex:1; }

  /* ===== 3D hero ===== */
  .hero { text-align:center; margin-bottom:10px; }
  .hero-scene { perspective:850px; width:230px; height:210px; margin:0 auto 4px; }
  .hero-tilt { position:relative; width:100%; height:100%; transform-style:preserve-3d;
    transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition:transform .18s ease-out; }
  .hero-idle { position:absolute; inset:0; transform-style:preserve-3d; animation:shieldIdle 9s ease-in-out infinite; }
  .shield-layer { position:absolute; left:50%; top:50%; width:150px; height:170px; margin:-85px 0 0 -75px; transform:translateZ(var(--z)); }
  .shield-layer svg { width:100%; height:100%; }
  .sl1 { --z:-34px; opacity:.35; } .sl2 { --z:-17px; opacity:.55; } .sl3 { --z:0px; } .sl4 { --z:22px; opacity:.4; }
  .orbit-ico { position:absolute; left:50%; top:50%; font-size:1.7rem; margin:-16px 0 0 -16px; will-change:transform;
    filter:drop-shadow(0 4px 8px var(--shadow)); }
  @keyframes shieldIdle { 0%,100% { transform:rotateY(-22deg) rotateX(6deg); } 50% { transform:rotateY(22deg) rotateX(-4deg); } }
  html[data-motion="off"] .hero-idle { animation:none; }
  @media (prefers-reduced-motion: reduce) { .hero-idle { animation:none; } }
  h1 { margin:0 0 8px; font-size:2.35rem; font-weight:800; letter-spacing:-.5px; line-height:1.15;
    background:linear-gradient(90deg,var(--accent2),var(--accent) 50%,#f472b6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  html[data-theme="contrast"] h1 { color:var(--accent); background:none; }
  .tagline { color:var(--muted); margin:0 auto; max-width:640px; font-size:1.05rem; }

  /* ===== how it works ===== */
  .how { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:20px 0 4px; perspective:900px; }
  .how-card { text-align:center; padding:14px 12px; }
  .how-card .ico { font-size:2rem; display:block; margin-bottom:4px; }
  .how-card b { display:block; font-size:.95rem; margin-bottom:2px; }
  .how-card span.d { color:var(--muted); font-size:.82rem; }

  /* ===== cards, 3D tilt ===== */
  .card { background:var(--card); border:1px solid var(--card-b); border-radius:20px; padding:18px; margin-top:18px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 14px 34px var(--shadow); }
  .tilt { transition:transform .18s ease-out, box-shadow .18s; transform-style:preserve-3d; will-change:transform; }
  .tilt.on { box-shadow:0 24px 48px var(--shadow); }
  textarea { width:100%; min-height:150px; padding:14px; border-radius:14px; border:1px solid var(--card-b); background:var(--input);
    color:var(--text); font:inherit; resize:vertical; }
  textarea:focus, button:focus-visible, select:focus-visible, a:focus-visible, .drop:focus-visible { outline:3px solid var(--accent2); outline-offset:2px; }
  .row-between { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .counter { color:var(--muted); font-size:.82rem; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  .chip { padding:6px 13px; border-radius:999px; border:1px solid var(--card-b); background:var(--input); color:var(--text);
    cursor:pointer; font:inherit; font-size:.85rem; transition:transform .15s; }
  .chip:hover { border-color:var(--accent2); transform:translateY(-2px); }

  /* image drop zone */
  .drop { margin-top:14px; border:2px dashed var(--card-b); border-radius:16px; padding:14px; text-align:center; cursor:pointer;
    background:var(--input); transition:border-color .2s, transform .2s; }
  .drop:hover, .drop.over { border-color:var(--accent2); transform:translateY(-2px); }
  .drop .big { font-size:1.9rem; display:block; }
  .drop b { display:block; }
  .thumbs { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .thumb { position:relative; width:112px; border:1px solid var(--card-b); border-radius:12px; overflow:hidden; background:var(--input); }
  .thumb img { display:block; width:100%; height:84px; object-fit:cover; }
  .thumb .st { font-size:.7rem; padding:4px 6px; color:var(--muted); min-height:26px; }
  .thumb .pbar { height:4px; background:rgba(148,163,184,.3); }
  .thumb .pbar > div { height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .2s; }
  .thumb .x { position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%; border:0; cursor:pointer;
    background:rgba(0,0,0,.65); color:#fff; font-size:.8rem; line-height:1; }
  .ocr-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .ocr-row select { width:auto; min-width:190px; }
  .privacy-line { color:var(--ok); font-size:.82rem; margin:10px 0 0; }

  /* buttons with 3D depth */
  .actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .btn { display:inline-block; padding:12px 24px; border:0; border-radius:14px; cursor:pointer; font:inherit; font-weight:650;
    color:var(--btn-text); background:linear-gradient(135deg,var(--accent),var(--accent2)); text-decoration:none; text-align:center;
    box-shadow:0 6px 0 rgba(0,0,0,.28), 0 12px 24px var(--shadow); transition:transform .1s, box-shadow .1s, filter .15s; }
  .btn:hover { filter:brightness(1.1); transform:translateY(-2px); }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.28), 0 4px 10px var(--shadow); }
  .btn:disabled { opacity:.7; cursor:progress; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--card-b); box-shadow:none; }
  .btn.call { display:block; margin-top:10px; background:linear-gradient(135deg,var(--danger1),var(--danger2)); color:#fff; }
  html[data-theme="contrast"] .btn.call { color:#000; }
  .btn.block { display:block; margin-top:8px; }
  .icon-btn { width:36px; height:36px; border-radius:50%; border:1px solid var(--card-b); background:var(--input); color:var(--text); cursor:pointer; font-size:1rem; }

  /* ===== scanner ===== */
  .scanner { text-align:center; padding:26px 16px; }
  .radar { position:relative; width:110px; height:110px; margin:0 auto 12px; perspective:500px; }
  .radar i { position:absolute; inset:0; border-radius:50%; border:3px solid var(--accent2); border-top-color:transparent;
    transform:rotateX(65deg); animation:radarSpin 1.4s linear infinite; }
  .radar i:nth-child(2) { inset:14px; border-color:var(--accent); border-top-color:transparent; animation-duration:2s; animation-direction:reverse; }
  .radar i:nth-child(3) { inset:30px; border-color:#f472b6; border-top-color:transparent; animation-duration:1s; }
  .radar span { position:absolute; left:50%; top:50%; font-size:1.8rem; margin:-16px 0 0 -16px; }
  @keyframes radarSpin { to { transform:rotateX(65deg) rotateZ(360deg); } }

  /* ===== results: gauge ===== */
  .verdict { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .verdict-ico { font-size:2.6rem; width:70px; height:70px; display:flex; align-items:center; justify-content:center; border-radius:20px;
    background:var(--input); border:1px solid var(--card-b); animation:flipIn .8s cubic-bezier(.2,.8,.2,1) both; }
  .level { font-size:1.35rem; font-weight:750; }
  .gauge-wrap { max-width:360px; margin:6px auto 0; }
  .gauge-wrap svg { width:100%; height:auto; display:block; overflow:visible; }
  .needle { transform-origin:100px 100px; transform:rotate(-90deg); transition:transform 1.3s cubic-bezier(.34,1.56,.64,1); }
  .gauge-num { font-size:2.4rem; font-weight:800; text-align:center; line-height:1; margin-top:-6px; }
  .gauge-sub { text-align:center; color:var(--muted); font-size:.85rem; }
  .why { color:var(--muted); font-size:.85rem; }
  .signs { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin-top:12px; perspective:900px; }
  .sign { background:var(--input); border:1px solid var(--card-b); border-radius:16px; padding:12px 14px; display:flex; gap:12px;
    animation:flipIn .7s cubic-bezier(.2,.8,.2,1) both; }
  .sign .ico { font-size:1.9rem; line-height:1; }
  .sign b { display:block; font-weight:650; }
  .steps-list { list-style:none; padding:0; margin:12px 0 0; counter-reset:s; }
  .steps-list li { position:relative; padding:10px 12px 10px 48px; margin-bottom:8px; background:var(--input); border:1px solid var(--card-b);
    border-radius:14px; counter-increment:s; animation:flipIn .6s cubic-bezier(.2,.8,.2,1) both; }
  .steps-list li::before { content:counter(s); position:absolute; left:12px; top:50%; transform:translateY(-50%); width:26px; height:26px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:var(--btn-text); font-weight:700; font-size:.85rem; display:flex; align-items:center; justify-content:center; }
  @keyframes flipIn { from { opacity:0; transform:perspective(700px) rotateX(-70deg) translateY(14px); } to { opacity:1; transform:perspective(700px) rotateX(0) translateY(0); } }
  html[data-motion="off"] .sign, html[data-motion="off"] .steps-list li, html[data-motion="off"] .verdict-ico, html[data-motion="off"] .radar i { animation:none; }
  @media (prefers-reduced-motion: reduce) { .sign, .steps-list li, .verdict-ico, .radar i { animation:none; } }
  .emergency { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:14px; padding:12px 14px; border-radius:14px;
    background:linear-gradient(135deg,rgba(239,68,68,.22),rgba(249,115,22,.22)); border:1px solid var(--danger1); }
  .note-card { border-left:4px solid var(--warn); }
  .error-card { border-left:4px solid var(--bad); }
  .info-card { border-left:4px solid var(--accent2); }
  .disc { color:var(--muted); font-size:.8rem; margin-top:14px; }
  .footer { text-align:center; padding:18px 14px 26px; color:var(--muted); font-size:.85rem; border-top:1px solid var(--card-b); }
  .footer strong { color:var(--text); font-size:1.08rem; }

  /* ===== language pop-up and mobile drawer ===== */
  .overlay { position:fixed; inset:0; background:rgba(4,7,20,.9); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; perspective:900px; }
  .modal { background:var(--side); border:1px solid var(--card-b); border-radius:24px; padding:32px 26px; max-width:440px; width:100%; text-align:center;
    animation:flipIn .8s cubic-bezier(.2,.8,.2,1) both; box-shadow:0 30px 70px rgba(0,0,0,.5); }
  .modal .logo { font-size:3rem; }
  .modal h2 { margin:4px 0; font-size:1.45rem; font-weight:750; }

  .modal .btn { display:block; width:100%; margin-top:14px; font-size:1.2rem; padding:15px; }
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:15; }
  @media (max-width: 900px) {
    .sidebar { transform:translateX(-105%); width:min(340px,88vw); }

    .main { margin-left:0; }
    .topbar { display:block; }
    h1 { font-size:1.75rem; }
    .how { grid-template-columns:1fr; }
    .cube, .ring { opacity:.35; }
  }

<body>
<div class="bg" aria-hidden="true">
  <div class="aurora"></div><div class="stars"></div><div class="grid3d"></div>

  </div>
</div>

<div id="chooser" class="overlay" role="dialog" aria-modal="true" aria-labelledby="chooserTitle">

    <div class="logo">🛡️</div>

    <h2>మీ భాషను ఎంచుకోండి</h2>
    <p>You can change this anytime in Settings.<br>మీరు దీన్ని సెట్టింగ్‌లలో ఎప్పుడైనా మార్చుకోవచ్చు.</p>

</div>

<div id="scrim" class="scrim hidden"></div>

<aside id="sidebar" class="sidebar" aria-label="Settings">

  </div>

  <section class="panel helpline">
    <h3 data-i18n="hlTitle"></h3>
    <p class="hl-sub" data-i18n="hlSub"></p>
    <div class="hl-number">1930</div>
    <a class="btn call" href="tel:1930" data-i18n="callBtn"></a>
    <a class="btn ghost block" href="https://cybercrime.gov.in" target="_blank" rel="noopener noreferrer" data-i18n="portalBtn"></a>

    <ol id="steps"></ol>
  </section>

  <section class="panel">

    <span class="label" data-i18n="themeLabel"></span>
    <div class="seg" id="themeSeg">
      <button type="button" data-theme="dark" aria-pressed="true" data-i18n="themeDark"></button>
      <button type="button" data-theme="light" aria-pressed="false" data-i18n="themeLight"></button>
      <button type="button" data-theme="contrast" aria-pressed="false" data-i18n="themeContrast"></button>
    </div>
    <span class="label" data-i18n="sizeLabel"></span>
    <div class="seg" id="sizeSeg">
      <button type="button" data-size="s" aria-pressed="false" data-i18n="sizeS"></button>
      <button type="button" data-size="m" aria-pressed="true" data-i18n="sizeM"></button>
      <button type="button" data-size="l" aria-pressed="false" data-i18n="sizeL"></button>
    </div>
    <span class="label" data-i18n="motionLabel"></span>
    <div class="seg" id="motionSeg">
      <button type="button" data-motion="on" aria-pressed="false" data-i18n="moFull"></button>
      <button type="button" data-motion="lite" aria-pressed="false" data-i18n="moLite"></button>
      <button type="button" data-motion="off" aria-pressed="false" data-i18n="motionOff"></button>

  </section>

  <section class="panel">

      <button type="button" data-v="off" aria-pressed="false" data-i18n="motionOff"></button>
    </div>

      <button type="button" data-v="normal" aria-pressed="true" data-i18n="spNormal"></button>
      <button type="button" data-v="fast" aria-pressed="false" data-i18n="spFast"></button>
    </div>
    <label class="label" for="vVoice" data-i18n="voiceVoiceLabel"></label>
    <select id="vVoice"></select>
    <button type="button" class="btn ghost block" id="vTest" data-i18n="voiceTest"></button>

  <section class="panel">
    <h3 data-i18n="tipsTitle"></h3>
    <ul id="tips"></ul>

  <section class="panel">
    <h3 data-i18n="privTitle"></h3>
    <p class="small-note" data-i18n="privText"></p>
    <span class="badge" data-i18n="badge"></span>

</aside>

  </main>

  </footer>
</div>

  const manual = VOICE.name && list.find((v) => v.name === VOICE.name);
  if (manual) return { voice: manual, pitch: 1, how: "manual" };
  const same = list.filter((v) => genderOf(v) === VOICE.gender);
  if (same.length) { same.sort((a, b) => Number(/-IN$/i.test(b.lang)) - Number(/-IN$/i.test(a.lang))); return { voice: same[0], pitch: 1, how: "gender" }; }
  return { voice: list[0], pitch: VOICE.gender === "male" ? 0.75 : 1.2, how: "pitch" };
}
function fmt(t, o) { return Object.keys(o).reduce((a, k) => a.split("{" + k + "}").join(o[k]), t); }

function buildSpeech(d, l) {
  const S = SPEECH[l], keys = d.indicators_found.map((i) => i.key);
  if (!keys.length) return S.safe;
  const reasons = keys.map((k) => S.reasons[k]).filter(Boolean);
  return (d.score >= 60 ? S.high : S.mid) + (reasons.length ? " " + S.why + " " + reasons.join(", ") + "." : "");
}
function updateListenBtn() { $("listenBtn").textContent = speaking ? UI[lang].stopListen : UI[lang].listen; $("listenBtn").setAttribute("aria-pressed", String(speaking)); }
function stopSpeaking() {
  speakToken++; speaking = false;
  if (voiceSupported()) speechSynthesis.cancel();
  Object.keys(AUD).forEach((g) => { try { AUD[g].pause(); } catch (e) {} });
  updateListenBtn();
}
function primeVoice() {
  if (!VOICE.on) return;
  if (voiceSupported()) { try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
  unlockAudio();
}

function speak(textFor) {          // textFor(l) returns the sentence(s) for language l
  if (!voiceSupported()) return;
  let l = voiceLang(), pick = pickVoice(l);
  if (!pick && l !== "en") { l = "en"; pick = pickVoice("en"); }
  if (!pick) return;
  stopSpeaking();
  const token = speakToken, parts = textFor(l).replace(/[\u200c\u200d]/g, "").match(/[^.!?।]+[.!?।]*/g) || [];
  speaking = true; updateListenBtn();
  setTimeout(() => {
    if (token !== speakToken) return;
    parts.forEach((part, i) => {
      const u = new SpeechSynthesisUtterance(part.trim());
      u.voice = pick.voice; u.lang = pick.voice.lang; u.pitch = pick.pitch; u.rate = RATES[VOICE.speed] || 1;
      u.onerror = (ev) => { if (token === speakToken && ev && ev.error && ev.error !== "canceled" && ev.error !== "interrupted") $("vStatus").textContent = UI[lang].voiceFailed; };
      if (i === parts.length - 1) { u.onend = () => { if (token === speakToken) { speaking = false; updateListenBtn(); } }; const prev = u.onerror; u.onerror = (ev) => { prev(ev); if (token === speakToken) { speaking = false; updateListenBtn(); } }; }
      speechSynthesis.speak(u);
    });
  }, 80);
}
/* ----- built-in recorded voices: real male / female voices that sound the same on every phone and laptop ----- */
let CLIPS = null;
const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
const AUD = {};   // one audio element per gender; the male one runs through a deep-bass filter
function audioFor(g) {
  if (AUD[g]) return AUD[g];
  const a = new Audio(); a.preload = "auto"; AUD[g] = a;
  if (g === "male") {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        const ctx = new AC(), src = ctx.createMediaElementSource(a);
        const low = ctx.createBiquadFilter(); low.type = "lowshelf"; low.frequency.value = 220; low.gain.value = 9;
        const high = ctx.createBiquadFilter(); high.type = "highshelf"; high.frequency.value = 3500; high.gain.value = -4;
        src.connect(low); low.connect(high); high.connect(ctx.destination); a._ctx = ctx;
      }
    } catch (e) {}
  }
  return a;
}
function unlockAudio() {      // must run inside a click so phones allow the voice to play after the analysis finishes
  if (!CLIPS) return;
  ["female", "male"].forEach((g) => {
    const a = audioFor(g);
    if (a._ctx && a._ctx.state === "suspended") a._ctx.resume().catch(() => {});
    try { a.src = SILENT; const pr = a.play(); if (pr && pr.catch) pr.catch(() => {}); } catch (e) {}
  });
}
function clipNames(d) {
  const keys = d.indicators_found.map((i) => i.key);
  if (!keys.length) return ["safe"];
  return [d.score >= 60 ? "high" : "mid", "why"].concat(keys.map((k) => "r_" + k));
}
const CLIP_NEEDED = ["high", "mid", "safe", "why", "test", "r_urgency", "r_prize", "r_money", "r_link", "r_sensitive", "r_threat", "r_impersonation", "r_new_payee", "r_too_good"];
function clipsFor(l, g) {   // only a COMPLETE set of recordings is used; otherwise the device voices take over
  const have = CLIPS && !VOICE.name && CLIPS[l] && CLIPS[l][g];
  return have && CLIP_NEEDED.every((n) => have.indexOf(n) > -1) ? have : null;
}
function clipPlan(names) {
  const l = voiceLang(), have = clipsFor(l, VOICE.gender);
  if (!have || !names.every((n) => have.indexOf(n) > -1)) return null;
  return { g: VOICE.gender, urls: names.map((n) => "/static/audio/" + l + "_" + VOICE.gender + "_" + n + ".mp3") };
}
function playClips(plan) {
  stopSpeaking();
  const token = speakToken, a = audioFor(plan.g); let i = 0;
  speaking = true; updateListenBtn();
  const finish = () => { if (token === speakToken) { speaking = false; updateListenBtn(); } };
  const failed = () => { if (token === speakToken) { finish(); $("vStatus").textContent = UI[lang].voiceFailed; } };
  const next = () => {
    if (token !== speakToken) return;
    if (i >= plan.urls.length) { finish(); return; }
    a.src = plan.urls[i++]; a.playbackRate = RATES[VOICE.speed] || 1;
    if (a._ctx && a._ctx.state === "suspended") a._ctx.resume().catch(() => {});
    const pr = a.play(); if (pr && pr.catch) pr.catch(failed);
  };
  a.onended = next; a.onerror = failed;
  next();
}
function speakResult(d) { const plan = clipPlan(clipNames(d)); if (plan) playClips(plan); else speak((l) => buildSpeech(d, l)); }
function speakTest() { const plan = clipPlan(["test"]); if (plan) playClips(plan); else speak((l) => SPEECH[l].test); }
fetch("/static/audio/manifest.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null))
  .then((m) => { CLIPS = m && m.clips ? m.clips : null; voiceRefresh(); }).catch(() => {});

function voiceMark(segId, value) { document.querySelectorAll("#" + segId + " button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === value))); }
function fillVoiceSelect() {
  const sel = $("vVoice"), u = UI[lang]; clearNode(sel);
  const auto = document.createElement("option"); auto.value = ""; auto.textContent = u.voiceAuto; sel.appendChild(auto);
  voicesFor(voiceLang()).forEach((v) => {
    const o = document.createElement("option"); o.value = v.name; const g = genderOf(v);
    o.textContent = v.name + (g ? " (" + (g === "female" ? u.gFemale : u.gMale) + ")" : ""); sel.appendChild(o);
  });
  sel.value = VOICE.name && voicesFor(voiceLang()).some((v) => v.name === VOICE.name) ? VOICE.name : "";
}
function updateVoiceStatus() {
  const u = UI[lang], box = $("vStatus"), l = voiceLang();
  if (clipsFor(l, VOICE.gender)) { box.textContent = fmt(u.voiceClip, { g: VOICE.gender === "male" ? u.gMale : u.gFemale, l: u.vlName[l] }); return; }
  if (!voiceSupported()) { box.textContent = u.voiceUnsupported; return; }
  if (!voiceList.length) { box.textContent = u.voiceNone; return; }
  const pick = pickVoice(l);
  if (!pick) { box.textContent = l === "en" ? "" : fmt(u.voiceNoLang, { l: u.vlName[l] }); return; }
  if (pick.how === "pitch") box.textContent = fmt(VOICE.gender === "male" ? u.voicePitchM : u.voicePitchF, { l: u.vlName[l] });
  else box.textContent = fmt(u.voiceUsing, { n: pick.voice.name });
}
function voiceRefresh() {
  const sup = voiceSupported() || !!CLIPS;
  $("vLang").value = voiceLang(); voiceMark("vOnSeg", VOICE.on ? "on" : "off"); voiceMark("vGenderSeg", VOICE.gender); voiceMark("vSpeedSeg", VOICE.speed);
  ["vLang", "vVoice", "vTest"].forEach((id) => { $(id).disabled = !sup; });
  $("listenBtn").classList.toggle("hidden", !sup || !(voiceList.length || CLIPS));
  fillVoiceSelect(); updateVoiceStatus(); updateListenBtn();
}
if (voiceSupported()) { refreshVoices(); speechSynthesis.addEventListener("voiceschanged", () => { refreshVoices(); voiceRefresh(); }); }

/* ===== 3D: tilt cards, hero parallax and orbiting icons ===== */
let tiltEl = null;
function resetTilt(el) { if (el) { el.style.transform = ""; el.classList.remove("on"); } }
document.addEventListener("pointermove", (e) => {
  if (!motionOn() || e.pointerType === "touch") return;
  const hero = $("heroTilt");
  const w = window.innerWidth, h = window.innerHeight;
  hero.style.setProperty("--ry", ((e.clientX / w - 0.5) * 50) + "deg");
  hero.style.setProperty("--rx", (-(e.clientY / h - 0.5) * 30) + "deg");
  const el = e.target.closest ? e.target.closest(".tilt") : null;
  if (tiltEl && tiltEl !== el) resetTilt(tiltEl);
  tiltEl = el;
  if (el) {
    const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
    el.style.transform = "perspective(800px) rotateX(" + (-y * 7) + "deg) rotateY(" + (x * 9) + "deg) translateZ(8px)"; el.classList.add("on");
  }
});
document.addEventListener("pointerleave", () => { resetTilt(tiltEl); tiltEl = null; });
const orbitIcons = Array.from(document.querySelectorAll(".orbit-ico"));
function orbit(t) {
  const on = motionOn();
  orbitIcons.forEach((el, i) => {
    const a = (on ? t / 1800 : 0) + i * Math.PI / 2;
    const x = Math.cos(a) * 118, z = Math.sin(a) * 118, y = Math.sin(a * 2) * 12;
    el.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px," + z.toFixed(1) + "px) scale(" + (0.85 + (z + 118) / 600).toFixed(2) + ")";
  });
  if (on) requestAnimationFrame(orbit);
}
function startOrbit() { requestAnimationFrame(orbit); }

/* ===== wiring (no inline handlers, so the strict CSP stays on) ===== */
$("pickEn").addEventListener("click", () => setLang("en"));
$("pickTe").addEventListener("click", () => setLang("te"));
$("langSel").addEventListener("change", (e) => setLang(e.target.value));
$("openSide").addEventListener("click", openSide);
$("riskStrip").addEventListener("click", scrollToResult);
$("closeSide").addEventListener("click", closeSide);
$("scrim").addEventListener("click", closeSide);
$("analyzeBtn").addEventListener("click", () => run(true));
$("msg").addEventListener("input", updateCounter);
$("ocrLang").addEventListener("change", () => { ocrChosenByUser = true; });
$("clearBtn").addEventListener("click", () => {
  stopSpeaking(); lastResult = null; $("riskStrip").classList.add("hidden");
  $("msg").value = ""; updateCounter(); hideMessages(); $("out").classList.add("hidden"); $("scanner").classList.add("hidden");
  images.forEach((i) => URL.revokeObjectURL(i.url)); images = []; renderThumbs();
});
document.querySelectorAll("[data-ex]").forEach((b) => b.addEventListener("click", () => { $("msg").value = EXAMPLES[lang][Number(b.dataset.ex)]; updateCounter(); run(); }));
document.querySelectorAll("#themeSeg button").forEach((b) => b.addEventListener("click", () => setSetting("theme", b.dataset.theme)));
document.querySelectorAll("#sizeSeg button").forEach((b) => b.addEventListener("click", () => setSetting("size", b.dataset.size)));
document.querySelectorAll("#motionSeg button").forEach((b) => b.addEventListener("click", () => { setSetting("motion", b.dataset.motion); startOrbit(); }));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSide(); });
// images: click, keyboard, drag & drop, paste
const drop = $("drop");
drop.addEventListener("click", () => $("fileInput").click());
drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("fileInput").click(); } });
$("fileInput").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => { if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
document.addEventListener("paste", (e) => {
  const files = Array.from((e.clipboardData && e.clipboardData.files) || []).filter((f) => f.type.indexOf("image/") === 0);
  if (files.length) { e.preventDefault(); addFiles(files); }
});

/* ===== start: remembered display settings, then always ask for the language ===== */

/* voice controls */
document.querySelectorAll("#vOnSeg button").forEach((b) => b.addEventListener("click", () => { VOICE.on = b.dataset.v === "on"; store("csp_von", b.dataset.v); if (!VOICE.on) stopSpeaking(); voiceMark("vOnSeg", b.dataset.v); }));
document.querySelectorAll("#vGenderSeg button").forEach((b) => b.addEventListener("click", () => { VOICE.gender = b.dataset.v; VOICE.name = ""; store("csp_vgender", VOICE.gender); store("csp_vvoice", ""); voiceRefresh(); }));
document.querySelectorAll("#vSpeedSeg button").forEach((b) => b.addEventListener("click", () => { VOICE.speed = b.dataset.v; store("csp_vspeed", VOICE.speed); voiceMark("vSpeedSeg", VOICE.speed); }));
$("vLang").addEventListener("change", (e) => { VOICE.lang = e.target.value; VOICE.name = ""; store("csp_vlang", VOICE.lang); store("csp_vvoice", ""); voiceRefresh(); });
$("vVoice").addEventListener("change", (e) => { VOICE.name = e.target.value; store("csp_vvoice", VOICE.name); updateVoiceStatus(); });
$("vTest").addEventListener("click", () => { primeVoice(); speakTest(); });
$("listenBtn").addEventListener("click", () => { if (speaking) { stopSpeaking(); } else if (lastResult) { speakResult(lastResult); } });

setSetting("theme", load("csp_theme", "dark"));
setSetting("size", load("csp_size", "m"));
setSetting("motion", load("csp_motion3", autoMotion()));
applyLang();
startOrbit();
$("chooser").classList.remove("hidden");
</script>
